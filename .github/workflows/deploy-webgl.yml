# Builds the Unity project for WebGL (desktop + phone textures) and publishes it to mihlab.org/play.
# mihlab.org is served from MIHLab-Org/mihlab-org.github.io, so this workflow
# copies the build into that repo's public/play/ folder and pushes. The site is a
# Vite (React) app: Vite copies public/ into the built site as-is, so the game ends
# up at /play/. Nothing else in the site repo is touched.
# Runs only when started by hand (Actions tab > "Deploy WebGL" > Run workflow).
# Setup and caveats: Docs/deploy-webgl.md

name: Deploy WebGL

on:
  workflow_dispatch:
    inputs:
      site_branch:
        description: Branch of mihlab-org.github.io that GitHub Pages publishes from
        default: main
        required: true
      site_folder:
        description: Folder in the site repo that becomes /play/ on the live site
        default: public/play
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-webgl
  cancel-in-progress: false

env:
  SITE_REPO: MIHLab-Org/mihlab-org.github.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout game (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      # Two builds of the same commit and quality, differing only in texture format:
      # DXT for desktop GPUs, ASTC for phones. Only the ASTC build's .data file is
      # kept; index.html picks it on browsers that support ASTC. See WebGLBuild.cs.
      - name: Build WebGL (desktop textures, DXT)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLBuild.BuildFromCommandLine
          customParameters: -textureSubtarget DXT
          # unityVersion is read from ProjectSettings/ProjectVersion.txt.

      - name: Build WebGL (phone textures, ASTC)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLBuild.BuildFromCommandLine
          customParameters: -textureSubtarget ASTC
          # Lands in build/astc/WebGL/WebGL, inside the git-ignored build/ folder.
          buildsPath: build/astc
          # The first build can leave Unity's own rewrites of settings files behind;
          # this is still the same commit, so don't refuse to build over them.
          allowDirtyBuild: true

      - name: Check build size
        run: |
          du -sh build/WebGL/WebGL build/astc/WebGL/WebGL
          # GitHub rejects any single file over 100 MB in a normal git push.
          big=$(find build/WebGL/WebGL build/astc/WebGL/WebGL/Build -type f -size +95M)
          if [ -n "$big" ]; then
            echo "::error::These build files are over 95 MB and can't be pushed to the site repo:"
            echo "$big"
            exit 1
          fi

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          ref: ${{ inputs.site_branch }}
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site

      # UnityPy lets the next step confirm the phone build really has ASTC textures.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install UnityPy==1.25.4

      - name: Copy build into the site repo
        env:
          SITE_FOLDER: ${{ inputs.site_folder }}
        run: |
          mkdir -p "site/$SITE_FOLDER"
          # --delete only inside that folder, so old build files don't pile up.
          rsync -a --delete --exclude '*_DoNotShip/' build/WebGL/WebGL/ "site/$SITE_FOLDER/"
          # Add the phone (ASTC) data file and patch index.html to choose it. Fails, and
          # nothing is pushed, if the phone build doesn't actually contain ASTC textures.
          python3 Tools/webgl_add_phone_build.py "site/$SITE_FOLDER" build/astc/WebGL/WebGL
          du -sh "site/$SITE_FOLDER"

      - name: Commit and push to site repo
        working-directory: site
        env:
          SITE_FOLDER: ${{ inputs.site_folder }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SITE_FOLDER"
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update WebGL build in ${SITE_FOLDER} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          # The Unity build takes 30-90 min, so the site branch may have moved since
          # checkout. Rebase onto it and retry instead of failing on a non-fast-forward.
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ inputs.site_branch }}" && \
              git push origin HEAD:${{ inputs.site_branch }} && break
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not push to ${{ inputs.site_branch }} after 3 attempts."
              exit 1
            fi
            sleep 10
          done
          echo "Published. The site's own build will redeploy it in a few minutes: https://mihlab.org/play/"
