# Builds the Unity project for WebGL and publishes it to mihlab.org/play.
# mihlab.org is served from MIHLab-Org/mihlab-org.github.io, so this workflow
# copies the build into that repo's play/ folder and pushes. Nothing else in
# the site repo is touched.
# Runs only when started by hand (Actions tab > "Deploy WebGL" > Run workflow).
# Setup and caveats: Docs/deploy-webgl.md

name: Deploy WebGL

on:
  workflow_dispatch:
    inputs:
      site_branch:
        description: Branch of mihlab-org.github.io that GitHub Pages publishes from
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-webgl
  cancel-in-progress: false

env:
  SITE_REPO: MIHLab-Org/mihlab-org.github.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout game (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: WebGLBuild.BuildFromCommandLine
          # unityVersion is read from ProjectSettings/ProjectVersion.txt.

      - name: Check build size
        run: |
          du -sh build/WebGL/WebGL
          # GitHub rejects any single file over 100 MB in a normal git push.
          big=$(find build/WebGL/WebGL -type f -size +95M)
          if [ -n "$big" ]; then
            echo "::error::These build files are over 95 MB and can't be pushed to the site repo:"
            echo "$big"
            exit 1
          fi

      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          ref: ${{ inputs.site_branch }}
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: site

      - name: Copy build into site/play
        run: |
          mkdir -p site/play
          # --delete only inside play/, so old build files don't pile up.
          rsync -a --delete build/WebGL/WebGL/ site/play/
          du -sh site/play

      - name: Commit and push to site repo
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update /play WebGL build from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:${{ inputs.site_branch }}
          echo "Published. Pages usually updates within a few minutes: https://mihlab.org/play/"
